name: llmops-course

services:
  # PostgreSQL: Metadata store for MLflow, KFP, Prompt Registry
  postgres:
    image: postgres:17-alpine3.24
    container_name: llmops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U llmops" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # LocalStack: S3-compatible object storage (replacement for MinIO)
  minio:
    image: localstack/localstack:4.0.3
    container_name: llmops-minio
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      LOCALSTACK_HOSTNAME: localhost
      DEBUG: 0
      TMPDIR: /localstack/tmp
    volumes:
      - minio_data:/localstack/tmp
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "4566:4566"
      - "4571:4571"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Redis: Semantic cache, session store, message broker
  redis:
    image: redis:8.8.4-alpine3.23
    container_name: llmops-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Prometheus: Metrics collection and time-series DB
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: llmops-prometheus
    volumes:
      - ./infra/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Grafana: Metrics visualization and dashboards
  grafana:
    image: grafana/grafana:13.2.5
    container_name: llmops-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/config/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      - prometheus

  # Jaeger: Distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: llmops-jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP receiver (gRPC)
      - "4318:4318"    # OTLP receiver (HTTP)
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # MLflow: Model registry and experiment tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0-full
    container_name: llmops-mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://llmops:llmops-password@postgres:5432/mlflow_db --default-artifact-root s3://mlflow-artifacts/
    ports:
      - "15000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow_db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow-artifacts/
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MLFLOW_S3_ENDPOINT_URL: http://minio:4566
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5000/health || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s

  # Qdrant: Vector database for semantic search / RAG
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: llmops-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT_API_KEY: qdrant-api-key
    healthcheck:
      test: [ "CMD", "sh", "-c", "true" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # LLMOps Training: Complete course with all modules
  training:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llmops-training
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /workspace/__pycache__
    environment:
      PYTHONUNBUFFERED: 1
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: llmops
      POSTGRES_PASSWORD: llmops-password
      MINIO_HOST: minio
      MINIO_PORT: 9000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MLFLOW_TRACKING_URI: http://mlflow:5000
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: 6831
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  postgres_data:
  minio_data:
  redis_data:
  prometheus_data:
  grafana_data:
  qdrant_data:

networks:
  default:
    name: llmops-network
