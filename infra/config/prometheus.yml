global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'llmops-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "alert_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Module 09: vLLM / Ollama inference metrics
  - job_name: 'llm-inference'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Module 10: Custom LLMOps metrics (TTFT, TPOT, KV cache)
  - job_name: 'llmops-metrics'
    static_configs:
      - targets: ['localhost:8001']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # PostgreSQL exporter (if running)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'postgres-exporter:9187'
